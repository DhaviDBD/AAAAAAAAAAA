<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Marcadores para Leitura - MindAR</title>
  <style>
    body {
      margin: 0; padding: 0;
      background-color: #121212; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 50px;
    }
    .marcador {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      text-align: center;
    }
    h2 {
      font-family: sans-serif;
      margin-top: 0;
      color: #333;
    }
    img {
      width: 400px; 
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="marcador">
    <h2>Marcador 1 (Vermelho)</h2>
    <img src="01-pdf.png" alt="Marcador 1">
  </div>

  <div class="marcador">
    <h2>Marcador 2 (Azul)</h2>
    <img src="02-pdf.png" alt="Marcador 2">
  </div>

</body>
</html>
